name: Andesite/Build & Deploy V1
description: Builds and deploys to IN-SMN

on:
  workflow_call:
    inputs:
      deploy-dir:
        required: true
        description: The folder where the docker-compose.yaml is, i.e. `/home/deploy/<deploy-dir>/docker-compose.yaml`
        type: string
      deploy-with:
        required: false
        type: boolean
        description: "Which method to use for deployment. Valid options: 'ssh', 'rhyolite', ''"
        default: "ssh"

      
      # General
      context-dir:
        required: false
        description: "The folder with the dockerfile. Use if not placed in the root directory. Prefix with `./`, e.g. `./website/`"
        type: string
        default: "."

      rhyolite-command:
        required: false
        description: "The Rhyolite command name, if it isn't \"docker-update\""
        type: string
        default: "docker-update"

      # Caching
      cache:
        required: false
        description: "How to cache things. Valid options: '', 'gha'"
        type: string
        default: ""
      gha-mode:
        required: false
        description: "The caching mode if cache: gha is used"
        type: string
        default: "min"
      
      # LFS
      use-lfs:
        required: false
        type: boolean
        description: "If the repository uses git lfs"
        default: false
      limit-lfs-to-directory:
        required: false
        type: string
        description: "Instead of checking out the entire repository with LFS, instead only use LFS on this specific folder. Useful for monorepos. Requires use-lfs: true"
        default: ""
      
    secrets:
      SSH_KEY:
        required: false
      SSH_HOST:
        required: false
      SSH_USERNAME:
        required: false
      RHYOLITE_TOKEN:
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  GHA_CACHE_MODE: "type=gha,mode=${{inputs.gha-mode}}"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: ${{ inputs.use-lfs && inputs.limit-lfs-to-directory == ''}}
      
      - name: LFS Pull
        if: ${{ inputs.use-lfs && inputs.limit-lfs-to-directory != '' }}
        run: git lfs pull --include="${{inputs.limit-lfs-to-directory}}/**" --exclude=""

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context-dir }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ (inputs.cache == 'gha' && 'type=gha') || ''}}
          cache-to: ${{ (inputs.cache == 'gha' && env.GHA_CACHE_MODE) || ''}}

  deploy-ssh:
    if: ${{ inputs.deploy-with == 'ssh' }}
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    permissions:
      packages: read
    steps:
      - name: Import and start on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: cd ${{ inputs.deploy-dir }} && echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin && docker compose up -d
  deploy-rhyolite:
    if: ${{ inputs.deploy-with == 'rhyolite' }}
    uses: itsektionen/rhyolite/.github/workflows/v1.yml@main
    needs:
      - build-and-push
    secrets:
      RHYOLITE_TOKEN: ${{ secrets.RHYOLITE_TOKEN }}
    with:
      deploy-dir: ${{ inputs.deploy-dir }}
      command-name: ${{ inputs.rhyolite-command }}
